{{- /*
    Tier 2 — category filter + compact/detailed view toggle.

    Category filter is a list of plain <button data-cat="..."> elements.
    Selection state is managed in JS (active class), so adding a new
    category requires no CSS or HTML changes — just a new categories:
    frontmatter value on any post.

    View toggle stays as radio+label because it's binary and CSS-driven
    sibling selectors are still the simplest mechanism there.

    Coordinates with archives.html:
      - Each .archive-entry has class archive-entry--cat-<cat-slug>
      - Each archive-entry has data-category="<cat-name>" (already in template)
*/}}

{{- /* Collect unique category names from all posts. */ -}}
{{- $cats := slice -}}
{{- range where site.RegularPages "Type" "in" site.Params.mainSections -}}
  {{- with .Params.categories -}}
    {{- range . -}}
      {{- if not (in $cats .) -}}
        {{- $cats = $cats | append . -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{- /* View toggle: hidden radios driven by CSS sibling selectors. */ -}}
<input type="radio" name="archive-view" id="archive-view-detailed" class="archive-radio" checked>
<input type="radio" name="archive-view" id="archive-view-compact" class="archive-radio">

<div class="archive-toolbar">
  <div class="archive-cat-filter" role="group" aria-label="按分类筛选">
    <button type="button" class="archive-pill archive-pill--cat archive-pill--active"
            data-cat="" aria-pressed="true">
      全部
    </button>
    {{- range $cats }}
    <button type="button" class="archive-pill archive-pill--cat"
            data-cat="{{ . }}" aria-pressed="false">
      {{ . }}
    </button>
    {{- end }}
  </div>

  <div class="archive-view-toggle" role="group" aria-label="视图密度">
    <label for="archive-view-detailed" class="archive-pill archive-pill--view" title="显示摘要和标签">
      详细
    </label>
    <label for="archive-view-compact" class="archive-pill archive-pill--view" title="只显示标题">
      紧凑
    </label>
  </div>
</div>
