# =============================================================
#  LiMing编程笔记 — Hugo 站点配置
#  格式: hugo.yaml；基于 PaperMod 主题推荐写法。
# =============================================================

baseURL: "https://limingcoding.github.io/"
title: LiMing编程笔记

defaultContentLanguage: zh-cn
defaultContentLanguageInSubdir: false

# ---------- 单语（中文） ----------
# 之前试过加英文（content/en/）但语言切换器没真正起效，
# 而且只有一篇英文 post，没意义。后续如果再开双语，
# 把这段注释换回多语言配置 + 重建 content/en/ 即可。
languages:
  zh-cn:
    languageName: 简体中文
    weight: 1
    languageCode: zh-CN
    title: "LiMing编程笔记"
    params:
      description: "技术学习笔记 · 实战 · 调优"

# ---------- Taxonomies ----------
# Hugo 默认是 categories + tags；显式列出以保留默认并新增 series。
# `series` 让任意 post 可以 front-matter 写 `series: [名名]` 即可归入
# 一个系列——PaperMod 的 taxonomy.html 自动渲染 /series/<名名>/ 列表。
taxonomies:
  category: categories
  tag: tags
  series: series

# ---------- PaperMod 主题参数 ----------
params:
  env: production
  description: "记录学习过程中整理的编程、开发与工具使用笔记。"
  keywords:
    - 编程
    - 技术笔记
    - LiMingCoding
    - Hugo
    - PaperMod
  # 默认 OG / Twitter share image（per-page 的 images front matter 会覆盖）
  images:
    - /img/og-default.svg

  defaultTheme: auto
  ShowThemeToggleButton: true
  ShowReadingTime: true
  ShowWordCount: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  # favicon 全部指向同一个 SVG，避免 404
  assets:
    favicon: /favicon.svg
    favicon16x16: /favicon.svg
    favicon32x32: /favicon.svg
    apple_touch_icon: /favicon.svg
    safari_pinned_tab: /favicon.svg
  ShowCodeCopyButtons: true
  ShowRssButtonInSiteCanal: true
  ShowAllCardsInArchive: false
  comments: true
  giscus:
    repo: "LiMingCoding/LiMingCoding.github.io"
    repoId: "MDEwOlJlcG9zaXRvcnkzODczMjk0MDY="
    category: "general"
    categoryId: "DIC_kwDOFxYtfs4DEf3j"
    mapping: "pathname"
    strict: "0"
    reactionsEnabled: "1"
    emitMetadata: "0"
    inputPosition: "top"
    theme: "preferred_color_scheme"
    lang: "zh-CN"
    loading: "lazy"
  math: true      # 启用 KaTeX（行内 $...$ + 块级 $$...$$）
  mermaid: true   # 启用 Mermaid shortcode

  author: LiMingCoding

  profileMode:
    enabled: true
    title: "LiMing编程笔记"
    subtitle: "技术学习笔记 · 实战 · 调优"
    imageUrl: "/img/avatar.svg"
    imageWidth: 120
    imageHeight: 120
    buttons:
      - name: "归档"
        url: "/archives/"
      - name: "关于"
        url: "/about/"
      - name: "GitHub"
        url: "https://github.com/LiMingCoding"
        weight: 10

  socialIcons:
    - name: github
      title: "GitHub"
      url: "https://github.com/LiMingCoding"

  homeInfoParams:
    Title: "欢迎来到 LiMing编程笔记 👋"
    Content: |
      这里记录我在学习中整理的编程笔记、踩坑经验和工具使用心得。
      偏向实战、调优思路，目标是写完就能用上。

  mainSections:
    - posts

# ---------- 菜单 ----------
menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 1
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 3
    - identifier: search
      name: 搜索
      url: /search/
      weight: 5
    - identifier: about
      name: 关于
      url: /about/
      weight: 7
    - identifier: rss
      name: RSS
      url: /index.xml
      weight: 9

# ---------- Markdown ----------
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: true
    codeFences: true
    guessSyntax: true

# ---------- 输出 / 分页 / 主题 ----------
outputFormats:
  RSS:
    mediatype: application/rss+xml
    baseName: index

outputs:
  home:
    - HTML
    - RSS
    - JSON # PaperMod 站内搜索的索引（/index.json）
  section:
    - HTML
    - RSS
    - JSON

pagination:
  pagerSize: 10

theme: PaperMod

permalinks:
  # posts 用文件名做 slug：content/posts/foo-bar.md → /posts/foo-bar/
  # 想用别的 URL，就在该文章 frontmatter 里加 slug: xxx（优先级高于文件名）
  posts: /posts/:filename/
  page: /:slug/
  about: /about/
